<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#BC8CFF" />
      <stop offset="100%" stop-color="#39D353" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #c9d1d9; }
    
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animated-bg-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .animated-float { animation: float 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2" />

  <!-- Dynamic Animated Background Visual Elements (strictly behind text) -->
  <g opacity="0.25">
    <circle class="animated-bg-circle" cx="1000" cy="80" r="140" fill="#7928CA" filter="url(#glow)" />
    <circle class="animated-bg-circle" cx="150" cy="240" r="120" fill="#00DFD8" filter="url(#glow)" />
    <path d="M 100,100 L 250,50 L 400,120 L 550,60 L 700,150 L 850,70 L 1050,130" stroke="#30363d" stroke-width="1.5" fill="none" stroke-dasharray="6,6" />
    <path d="M 150,220 L 300,270 L 500,200 L 680,260 L 900,210 L 1100,250" stroke="#30363d" stroke-width="1.5" fill="none" stroke-dasharray="6,6" />
  </g>

  <!-- Decorative Top Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#accent-grad)" />

  <!-- Foreground Content -->
  <g class="animated-float">
    <rect x="60" y="45" width="230" height="32" rx="16" fill="#21262d" stroke="#30363d" stroke-width="1" />
    <text x="75" y="66" class="badge-text" fill="#58A6FF">⚡ CURATED ECOSYSTEM</text>
  </g>

  <text x="60" y="130" class="title">Awesome Serverless Cloud Data Warehouse 🚀</text>
  <text x="60" y="170" class="subtitle">A curated collection of top-tier Serverless, Analytical (OLAP) & Data Lakehouse engines</text>

  <g transform="translate(60, 210)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="16" y="23" class="badge-text">☁️ Cloud Managed</text>
    
    <rect x="175" y="0" width="170" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="191" y="23" class="badge-text">🔥 Open-Source OLAP</text>
    
    <rect x="360" y="0" width="165" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="376" y="23" class="badge-text">⚡ Pay-Per-Query</text>

    <rect x="540" y="0" width="160" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="556" y="23" class="badge-text">🏆 Star Ratings</text>
  </g>
</svg>
